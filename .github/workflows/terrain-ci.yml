name: Cesium Terrain checks

on:
  pull_request:
    paths:
      - 'src-tauri/src/**'
      - 'frontend/src/**'
      - '.github/workflows/terrain-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend TypeScript and Vite
        run: |
          npm install --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
      - name: Rust compile
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Terrain unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml terrain_ion --lib
